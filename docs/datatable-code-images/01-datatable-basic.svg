<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="980" rx="28" fill="#0B1020"/>
  <rect x="34" y="34" width="1532" height="912" rx="22" fill="#111827" stroke="#1F2937" stroke-width="2"/>
  <circle cx="78" cy="77" r="10" fill="#EF4444"/>
  <circle cx="110" cy="77" r="10" fill="#F59E0B"/>
  <circle cx="142" cy="77" r="10" fill="#22C55E"/>
  <text x="190" y="84" fill="#E5E7EB" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">DataTable - Basic Usage</text>
  <text x="1410" y="84" fill="#60A5FA" font-size="22" font-family="Segoe UI, Arial, sans-serif">01</text>
  <foreignObject x="60" y="118" width="1480" height="790">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;border-radius:20px;background:#0F172A;border:1px solid #1E293B;padding:30px;box-sizing:border-box;">
      <pre style="margin:0;color:#E5E7EB;font: 28px/1.68 Consolas, 'Cascadia Code', 'Segoe UI Mono', monospace;white-space:pre-wrap;">
<span style="color:#C084FC;">import</span> { <span style="color:#93C5FD;">DataTable</span> } <span style="color:#C084FC;">from</span> <span style="color:#86EFAC;">"@/components/dashboard/DataTable"</span>;

<span style="color:#C084FC;">const</span> <span style="color:#FDE68A;">columns</span> = [
  { <span style="color:#7DD3FC;">key</span>: <span style="color:#86EFAC;">"name"</span>, <span style="color:#7DD3FC;">label</span>: <span style="color:#86EFAC;">"الاسم"</span>, <span style="color:#7DD3FC;">sortable</span>: <span style="color:#FCA5A5;">true</span> },
  { <span style="color:#7DD3FC;">key</span>: <span style="color:#86EFAC;">"email"</span>, <span style="color:#7DD3FC;">label</span>: <span style="color:#86EFAC;">"البريد"</span>, <span style="color:#7DD3FC;">sortable</span>: <span style="color:#FCA5A5;">true</span> },
  { <span style="color:#7DD3FC;">key</span>: <span style="color:#86EFAC;">"createdAt"</span>, <span style="color:#7DD3FC;">label</span>: <span style="color:#86EFAC;">"تاريخ الإنشاء"</span>, <span style="color:#7DD3FC;">sortable</span>: <span style="color:#FCA5A5;">true</span> },
];

<span style="color:#C084FC;">const</span> <span style="color:#FDE68A;">data</span> = [
  { <span style="color:#7DD3FC;">name</span>: <span style="color:#86EFAC;">"Ali"</span>, <span style="color:#7DD3FC;">email</span>: <span style="color:#86EFAC;">"ali@example.com"</span>, <span style="color:#7DD3FC;">createdAt</span>: <span style="color:#86EFAC;">"2026-03-31"</span> },
  { <span style="color:#7DD3FC;">name</span>: <span style="color:#86EFAC;">"Sara"</span>, <span style="color:#7DD3FC;">email</span>: <span style="color:#86EFAC;">"sara@example.com"</span>, <span style="color:#7DD3FC;">createdAt</span>: <span style="color:#86EFAC;">"2026-03-30"</span> },
];

<span style="color:#C084FC;">export default function</span> <span style="color:#93C5FD;">UsersTable</span>() {
  <span style="color:#C084FC;">return</span> (
    <span style="color:#FCA5A5;">&lt;DataTable</span>
      <span style="color:#7DD3FC;">title</span>=<span style="color:#86EFAC;">"المستخدمون"</span>
      <span style="color:#7DD3FC;">columns</span>={<span style="color:#FDE68A;">columns</span>}
      <span style="color:#7DD3FC;">data</span>={<span style="color:#FDE68A;">data</span>}
    <span style="color:#FCA5A5;">/&gt;</span>
  );
}
      </pre>
    </div>
  </foreignObject>
  <text x="60" y="940" fill="#94A3B8" font-size="20" font-family="Segoe UI, Arial, sans-serif">Basic pattern: define columns, prepare data, then pass both to DataTable.</text>
</svg>

